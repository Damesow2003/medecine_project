<!-- loading.component.html -->
<div *ngIf="isLoading$ | async" class="loading-overlay">
    <div class="loading-content">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Chargement...</span>
        </div>
        <h2 class="mt-3">Traitement des données...</h2>
        <p>Veuillez patienter pendant que nous traitons vos requêtes...</p>
        <div class="progress mt-3" style="height: 20px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar"
                 [style.width]="(progress$ | async) + '%'"
                 [attr.aria-valuenow]="progress$ | async"
                 aria-valuemin="0"
                 aria-valuemax="100">
                {{(progress$ | async) | number:'1.0-0'}}%
            </div>
        </div>
    </div>
</div>
