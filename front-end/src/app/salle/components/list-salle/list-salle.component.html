<div *ngIf="salles$ | async as salles" class="container-fluid py-3 animate__animated animate__fadeIn my-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                <i class="fas fa-door-open me-2"></i>Liste des Salles
            </h3>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="w-10">ID</th>
                    <th scope="col" class="w-25">Nom</th>
                    <th scope="col" class="w-25">Numéro</th>
                    <th scope="col" class="w-25">Status</th>
                    <th scope="col" class="w-25 text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let salle of salles" class="animate__animated animate__fadeInUp">
                    <th scope="row" class="align-middle">{{salle.idSalle}}</th>
                    <td class="align-middle">
                        <i class="fas fa-door-closed text-secondary me-2" role="button" (click)="onLoadSalleDetails(salle.idSalle)"></i>
                        {{salle.nomSalle}}
                    </td>
                    <td class="align-middle">
              <span class="badge bg-info text-dark">
                <i class="fas fa-hashtag me-1"></i>
                  {{salle.numeroSalle}}
              </span>
                    </td>
                    <td class="align-middle">
  <span class="badge rounded-pill bg-info text-dark px-3 py-2 d-inline-flex align-items-center gap-2">
    <i class="fas fa-circle-info"></i>
    <span>{{ salle.status | titlecase }}</span>
  </span>
                    </td>

                    <td class="align-middle text-center">
                        <button class="btn btn-sm btn-outline-primary me-2"
                                title="Modifier"
                                (click)="onEdit(salle)"
                                data-bs-toggle="tooltip">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger"
                                title="Supprimer"
                                (click)="onDelete(salle)"
                                data-bs-toggle="tooltip">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div *ngIf="salles.length === 0" class="text-center py-4 text-muted animate__animated animate__fadeIn">
            <i class="fas fa-door-open fa-3x mb-3"></i>
            <h5>Aucune salle disponible</h5>
        </div>
    </div>
</div>
