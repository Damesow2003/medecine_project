<div class="container-fluid min-vh-100 d-flex flex-column flex-md-row p-0">
    <!-- Section gauche - Présentation -->
    <div class="col-12 col-md-6 bg-primary text-white d-flex flex-column justify-content-center p-4 p-lg-5 text-center text-md-start">
        <div class="mx-auto mx-md-0" style="max-width: 500px;">
            <h2 class="display-5 display-md-4 fw-bold mb-4 animate__animated animate__fadeIn">Thiellal, sa "weergu Yaramm si numerique!"</h2>
            <p class="fs-5 mb-4 animate__animated animate__fadeIn animate__delay-1s">
                Thiellal, votre platforme numerique
            </p>
            <div class="mt-3 animate__animated animate__fadeIn animate__delay-2s">
                <a routerLink="/" class="btn btn-outline-light rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Revenir à l'accueil
                </a>
            </div>
        </div>
    </div>

    <!-- Section droite - Formulaire -->
    <div class="col-12 col-md-6 bg-white d-flex align-items-center justify-content-center p-4 p-lg-5">
        <div class="w-100 shadow-sm rounded-lg p-4 p-md-5" style="max-width: 450px;">
            <div class="text-center mb-4">
              <!--  <img src="assets/logo.png" alt="Logo Thiellal" class="mb-3" style="height: 60px;"> -->
                <h2 class="h3 fw-bold text-dark">Connexion à votre espace</h2>
                <p class="text-muted">Accédez à tous vos services santé</p>
            </div>

            <form [formGroup]="loginForm">
                <div class="mb-4">
                    <label for="email" class="form-label fw-medium text-dark">Nom d'utilisateur</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person text-muted"></i>
                        </span>
                        <input type="text" id="email" class="form-control border-start-0"
                               placeholder="Lappoo Abou" formControlName="username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-medium text-dark">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" id="password" class="form-control border-start-0"
                               placeholder="Entrez 7 caractères ou plus" formControlName="password" required>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted small" for="rememberMe">
                            Se souvenir de moi
                        </label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-medium shadow-sm"
                        (click)="onLogin()">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-2">Pas encore inscrit ?</p>
                    <a routerLink="/auth/register" class="btn btn-outline-primary rounded-pill px-4">
                        Créer un compte
                    </a>
                </div>

                <div *ngIf="isAuthentified" class="alert alert-danger mt-4 text-center small py-2">
                    <i class="bi bi-exclamation-circle me-2"></i>Nom d'utilisateur ou mot de passe invalide
                </div>
            </form>
        </div>
    </div>
</div>
