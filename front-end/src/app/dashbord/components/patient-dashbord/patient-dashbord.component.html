<div class="dashboard-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <i class="fas fa-user-injured me-2"></i>Mon Tableau de Bord
            </h2>
        </div>
        <ul class="sidebar-menu">
            <li class="active">
                <a routerLink="/dashboard">
                    <i class="fas fa-home fa-fw me-3"></i>
                    <span class="menu-text">Accueil</span>
                </a>
            </li>
            <li>
                <a routerLink="/rendezvous">
                    <i class="fas fa-calendar-check fa-fw me-3"></i>
                    <span class="menu-text">Rendez-vous</span>
                </a>
            </li>
            <li>
                <a routerLink="/prescriptions">
                    <i class="fas fa-prescription-bottle-alt fa-fw me-3"></i>
                    <span class="menu-text">Prescriptions</span>
                </a>
            </li>
            <li>
                <a routerLink="/notifications">
                    <i class="fas fa-bell fa-fw me-3"></i>
                    <span class="menu-text">Notifications</span>
                    <span class="badge">2</span>
                </a>
            </li>
            <li>
                <a routerLink="/paiements">
                    <i class="fas fa-credit-card fa-fw me-3"></i>
                    <span class="menu-text">Paiements</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <button class="logout-btn" (click)="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>
                <span>Se déconnecter</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1 class="welcome-title">
                <i class="fas fa-heartbeat me-3"></i>Bienvenue, <span class="patient-name">Patient</span>
            </h1>
            <div class="header-date">
                <i class="fas fa-calendar-day me-2"></i>
                <span id="current-date"></span>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <!-- Next Appointment Card -->
            <div class="stat-card appointment-card">
                <div class="card-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="card-content">
                    <h3>Prochain Rendez-vous</h3>
                    <span class="stat-value">12 Juin 2024</span>
                    <span class="stat-time">14h00</span>
                    <div class="card-badge urgent">
                        <i class="fas fa-exclamation-circle me-1"></i> Confirmé
                    </div>
                </div>
            </div>

            <!-- Prescriptions Card -->
            <div class="stat-card prescription-card">
                <div class="card-icon">
                    <i class="fas fa-pills"></i>
                </div>
                <div class="card-content">
                    <h3>Ordonnances Actives</h3>
                    <span class="stat-value">3</span>
                    <span class="stat-detail">Médicaments</span>
                    <a href="#" class="card-link">Voir détails <i class="fas fa-arrow-right"></i></a>
                </div>
            </div>

            <!-- Notifications Card -->
            <div class="stat-card notification-card">
                <div class="card-icon">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="card-content">
                    <h3>Notifications</h3>
                    <span class="stat-value">2</span>
                    <span class="stat-detail">Nouvelles alertes</span>
                    <div class="notification-dot pulse"></div>
                </div>
            </div>
        </div>

        <!-- Upcoming Appointments -->
        <div class="appointments-section">
            <h2 class="section-title">
                <i class="fas fa-calendar-alt me-2"></i>Vos prochains rendez-vous
            </h2>
            <div class="appointments-list">
                <!-- Appointment items would go here -->
            </div>
        </div>
    </main>
</div>
